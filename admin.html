<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Multi-Chit Bill Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: #ffffff; width: 100%; max-width: 520px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); overflow: hidden; margin-bottom: 20px; }
    .card-header { background: #1e293b; color: #ffffff; padding: 20px; text-align: center; }
    .card-header h2 { font-size: 1.3rem; font-weight: 700; }
    .card-body { padding: 20px; }
    
    .section-title { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; font-weight: 700; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-top: 16px; }
    .section-title:first-child { margin-top: 0; }

    label { font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
    
    .chit-block { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; margin-bottom: 12px; position: relative; }
    .remove-btn { position: absolute; top: 8px; right: 8px; background: #ef4444; color: white; border: none; padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; }
    
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .subtotal-text { font-size: 0.85rem; font-weight: 700; color: #2563eb; margin-top: 8px; text-align: right; }
    
    .grand-total-box { background: #e0f2fe; border: 2px dashed #0284c7; padding: 12px; border-radius: 10px; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: #0369a1; font-size: 1.1rem; }

    .btn { width: 100%; background: #16a34a; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 12px; cursor: pointer; margin-top: 16px; }
    .btn-add { background: #2563eb; margin-top: 8px; padding: 10px; font-size: 0.85rem; }
    .btn-copy { background: #0284c7; margin-top: 10px; }
    
    #link-box { display: none; margin-top: 16px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
    .custom-input { display: none; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h2>Multi-Chit Bill Generator</h2>
      <p style="font-size: 0.85rem; opacity: 0.8; margin-top: 4px;">Admin Portal</p>
    </div>
    
    <div class="card-body">
      
      <div class="section-title">1. Receiver & Organization</div>
      <label>Receiver UPI ID / VPA</label>
      <input type="text" id="adm-receiver-upi" value="8522076121@upi" placeholder="e.g. 8522076121@ybl">

      <label>Organization Name</label>
      <input type="text" id="adm-payee-name" value="Chit Savings Trust">

      <div class="section-title">2. Member Details</div>
      <label>Member Name</label>
      <input type="text" id="adm-m-name" placeholder="e.g. Raju">
      
      <label>Member Mobile Number</label>
      <input type="text" id="adm-m-phone" placeholder="e.g. 9247447830">

      <div class="section-title">3. Chit Schemes Participating</div>
      <div id="chits-container">
        <!-- Default Chit Block -->
        <div class="chit-block">
          <label>Select Chit Plan</label>
          <select class="chit-plan" onchange="toggleCustomInput(this)">
            <option value="50,000 Chit Plan">50,000 Chit Plan</option>
            <option value="1-Lakh Chit Plan" selected>1-Lakh Chit Plan</option>
            <option value="1.5-Lakh Chit Plan">1.5-Lakh Chit Plan</option>
            <option value="2-Lakh Chit Plan">2-Lakh Chit Plan</option>
            <option value="2.5-Lakh Chit Plan">2.5-Lakh Chit Plan</option>
            <option value="3-Lakh Chit Plan">3-Lakh Chit Plan</option>
            <option value="3.5-Lakh Chit Plan">3.5-Lakh Chit Plan</option>
            <option value="4-Lakh Chit Plan">4-Lakh Chit Plan</option>
            <option value="4.5-Lakh Chit Plan">4.5-Lakh Chit Plan</option>
            <option value="5-Lakh Chit Plan">5-Lakh Chit Plan</option>
            <option value="5.5-Lakh Chit Plan">5.5-Lakh Chit Plan</option>
            <option value="6-Lakh Chit Plan">6-Lakh Chit Plan</option>
            <option value="6.5-Lakh Chit Plan">6.5-Lakh Chit Plan</option>
            <option value="7-Lakh Chit Plan">7-Lakh Chit Plan</option>
            <option value="7.5-Lakh Chit Plan">7.5-Lakh Chit Plan</option>
            <option value="8-Lakh Chit Plan">8-Lakh Chit Plan</option>
            <option value="8.5-Lakh Chit Plan">8.5-Lakh Chit Plan</option>
            <option value="9-Lakh Chit Plan">9-Lakh Chit Plan</option>
            <option value="9.5-Lakh Chit Plan">9.5-Lakh Chit Plan</option>
            <option value="10-Lakh Chit Plan">10-Lakh Chit Plan</option>
            <option value="CUSTOM">Custom Plan (Type Custom Name)</option>
          </select>
          <input type="text" class="custom-input" placeholder="Type Custom Chit Plan Name...">
          
          <div class="row-2">
            <div>
              <label>Current Installment</label>
              <select class="chit-curr-term"></select>
            </div>
            <div>
              <label>Total Tenure</label>
              <select class="chit-total-term"></select>
            </div>
          </div>

          <div class="row-2">
            <div>
              <label>No. of Chits</label>
              <select class="chit-qty" onchange="calculateSubtotals()"></select>
            </div>
            <div>
              <label>Monthly Amount (₹)</label>
              <input type="number" class="chit-amt" value="5000" oninput="calculateSubtotals()">
            </div>
          </div>

          <div class="subtotal-text">Plan Subtotal: ₹<span class="plan-subtotal">5000.00</span></div>
        </div>
      </div>

      <button class="btn btn-add" onclick="addChitRow()">+ Add Another Chit Plan</button>

      <div class="section-title" style="margin-top:20px;">4. Outstanding Balance</div>
      <label>Previous Due Amount (₹)</label>
      <input type="number" id="adm-price-due" value="0" oninput="calculateSubtotals()">

      <div class="grand-total-box">
        <span>Grand Total Amount:</span>
        <span>₹<span id="adm-grand-total">5000.00</span></span>
      </div>

      <button class="btn" onclick="generateShareableLink()">Generate Member Bill Link</button>

      <div id="link-box">
        <label>Created Shareable Link:</label>
        <input type="text" id="adm-generated-url" readonly>
        <button class="btn btn-copy" onclick="copyShareLink()">Copy Link for WhatsApp</button>
      </div>

    </div>
  </div>

  <script>
    function populateDropdown(selectElement, max, defaultVal) {
      selectElement.innerHTML = '';
      for (let i = 1; i <= max; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = i;
        if (i === defaultVal) opt.selected = true;
        selectElement.appendChild(opt);
      }
    }

    function initBlockDropdowns(block) {
      populateDropdown(block.querySelector('.chit-curr-term'), 50, 4);
      populateDropdown(block.querySelector('.chit-total-term'), 50, 20);
      populateDropdown(block.querySelector('.chit-qty'), 10, 1);
    }

    initBlockDropdowns(document.querySelector('.chit-block'));

    function toggleCustomInput(selectElem) {
      const customInput = selectElem.parentElement.querySelector('.custom-input');
      if (selectElem.value === 'CUSTOM') {
        customInput.style.display = 'block';
      } else {
        customInput.style.display = 'none';
      }
    }

    function addChitRow() {
      const container = document.getElementById('chits-container');
      const div = document.createElement('div');
      div.className = 'chit-block';
      div.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove(); calculateSubtotals();">Remove</button>
        <label>Select Chit Plan</label>
        <select class="chit-plan" onchange="toggleCustomInput(this)">
          <option value="50,000 Chit Plan">50,000 Chit Plan</option>
          <option value="1-Lakh Chit Plan">1-Lakh Chit Plan</option>
          <option value="1.5-Lakh Chit Plan">1.5-Lakh Chit Plan</option>
          <option value="2-Lakh Chit Plan" selected>2-Lakh Chit Plan</option>
          <option value="2.5-Lakh Chit Plan">2.5-Lakh Chit Plan</option>
          <option value="3-Lakh Chit Plan">3-Lakh Chit Plan</option>
          <option value="3.5-Lakh Chit Plan">3.5-Lakh Chit Plan</option>
          <option value="4-Lakh Chit Plan">4-Lakh Chit Plan</option>
          <option value="4.5-Lakh Chit Plan">4.5-Lakh Chit Plan</option>
          <option value="5-Lakh Chit Plan">5-Lakh Chit Plan</option>
          <option value="5.5-Lakh Chit Plan">5.5-Lakh Chit Plan</option>
          <option value="6-Lakh Chit Plan">6-Lakh Chit Plan</option>
          <option value="6.5-Lakh Chit Plan">6.5-Lakh Chit Plan</option>
          <option value="7-Lakh Chit Plan">7-Lakh Chit Plan</option>
          <option value="7.5-Lakh Chit Plan">7.5-Lakh Chit Plan</option>
          <option value="8-Lakh Chit Plan">8-Lakh Chit Plan</option>
          <option value="8.5-Lakh Chit Plan">8.5-Lakh Chit Plan</option>
          <option value="9-Lakh Chit Plan">9-Lakh Chit Plan</option>
          <option value="9.5-Lakh Chit Plan">9.5-Lakh Chit Plan</option>
          <option value="10-Lakh Chit Plan">10-Lakh Chit Plan</option>
          <option value="CUSTOM">Custom Plan (Type Custom Name)</option>
        </select>
        <input type="text" class="custom-input" placeholder="Type Custom Chit Plan Name...">
        
        <div class="row-2">
          <div>
            <label>Current Installment</label>
            <select class="chit-curr-term"></select>
          </div>
          <div>
            <label>Total Tenure</label>
            <select class="chit-total-term"></select>
          </div>
        </div>

        <div class="row-2">
          <div>
            <label>No. of Chits</label>
            <select class="chit-qty" onchange="calculateSubtotals()"></select>
          </div>
          <div>
            <label>Monthly Amount (₹)</label>
            <input type="number" class="chit-amt" value="10000" oninput="calculateSubtotals()">
          </div>
        </div>

        <div class="subtotal-text">Plan Subtotal: ₹<span class="plan-subtotal">10000.00</span></div>
      `;
      container.appendChild(div);
      initBlockDropdowns(div);
      calculateSubtotals();
    }

    function calculateSubtotals() {
      const blocks = document.querySelectorAll('.chit-block');
      let grandTotal = parseFloat(document.getElementById('adm-price-due').value) || 0;

      blocks.forEach(block => {
        const qty = parseFloat(block.querySelector('.chit-qty').value) || 0;
        const amt = parseFloat(block.querySelector('.chit-amt').value) || 0;
        const subtotal = qty * amt;
        block.querySelector('.plan-subtotal').innerText = subtotal.toFixed(2);
        grandTotal += subtotal;
      });

      document.getElementById('adm-grand-total').innerText = grandTotal.toFixed(2);
    }

    function generateShareableLink() {
      const upi = encodeURIComponent(document.getElementById('adm-receiver-upi').value);
      const payee = encodeURIComponent(document.getElementById('adm-payee-name').value);
      const name = encodeURIComponent(document.getElementById('adm-m-name').value);
      const phone = encodeURIComponent(document.getElementById('adm-m-phone').value);
      const prevDue = encodeURIComponent(document.getElementById('adm-price-due').value || "0");

      const blocks = document.querySelectorAll('.chit-block');
      let chitList = [];

      blocks.forEach(block => {
        const selectPlan = block.querySelector('.chit-plan').value;
        const customPlan = block.querySelector('.custom-input').value;
        const planName = (selectPlan === 'CUSTOM' && customPlan.trim() !== '') ? customPlan : selectPlan;

        chitList.push({
          p: planName,
          c: block.querySelector('.chit-curr-term').value,
          t: block.querySelector('.chit-total-term').value,
          q: block.querySelector('.chit-qty').value,
          a: block.querySelector('.chit-amt').value
        });
      });

      const chitsData = encodeURIComponent(JSON.stringify(chitList));
      const shareUrl = `https://tejagoud733.github.io/Payment-page/?upi=${upi}&payee=${payee}&name=${name}&phone=${phone}&chitsData=${chitsData}&due=${prevDue}`;

      document.getElementById('adm-generated-url').value = shareUrl;
      document.getElementById('link-box').style.display = 'block';
    }

    function copyShareLink() {
      const copyInput = document.getElementById('adm-generated-url');
      copyInput.select();
      document.execCommand('copy');
      alert("Link copied! Send it to your member on WhatsApp.");
    }
  </script>
</body>
</html>
