<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Request & Receipt</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; flex-direction: column; }
    .card { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; }
    .card-header { background: #1e293b; color: white; padding: 20px; text-align: center; }
    .card-header h2 { font-size: 1.1rem; opacity: 0.8; font-weight: 400; }
    .card-header .payee { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
    .card-body { padding: 20px; }
    
    .breakdown-title { font-size: 0.85rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; font-weight: 600; }
    .item-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; color: #334155; }
    .divider { height: 1px; background: #e2e8f0; margin: 12px 0; }
    .total-row { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; color: #0f172a; margin-top: 8px; }
    
    .btn { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 12px; cursor: pointer; margin-top: 16px; }
    .btn:active { background: #1d4ed8; }
    .btn-success { background: #16a34a; }
    .btn-outline { background: transparent; border: 2px solid #2563eb; color: #2563eb; margin-top: 10px; }
    
    #receipt-area { display: none; background: #ffffff; padding: 24px; border: 1px solid #cbd5e1; border-radius: 12px; }
    .receipt-badge { display: inline-block; background: #dcfce7; color: #15803d; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; }
    .receipt-tx-id { font-family: monospace; font-size: 0.85rem; color: #64748b; margin-bottom: 16px; }

    /* Form styling for Admin mode */
    input { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
    .admin-toggle { margin-top: 20px; font-size: 0.85rem; color: #64748b; text-decoration: underline; cursor: pointer; }
    #output-url { width: 100%; height: 70px; margin-top: 10px; font-size: 0.85rem; padding: 8px; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    
    <!-- PAYMENT SCREEN (MEMBER VIEW) -->
    <div id="payment-screen">
      <div class="card-header">
        <h2>Payment Requested By</h2>
        <div class="payee" id="payee-name">--</div>
      </div>
      
      <div class="card-body">
        <div class="breakdown-title">Payment Breakdown</div>
        <div id="breakdown-list"></div>
        <div class="divider"></div>
        
        <div class="total-row">
          <span>Total Amount</span>
          <span id="total-amount">₹0.00</span>
        </div>

        <button class="btn" onclick="triggerUPIPayment()">Pay Now</button>
      </div>
    </div>

    <!-- POST-PAYMENT CONFIRMATION -->
    <div id="confirm-screen" style="display: none;" class="card-body">
      <h3 style="color: #0f172a; margin-bottom: 8px;">Did you complete the payment?</h3>
      <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">If your UPI app authorized the transaction, click below to generate your official receipt.</p>
      <button class="btn btn-success" onclick="generateReceipt()">Yes, Generate Receipt</button>
      <button class="btn btn-outline" onclick="resetToPayment()">No, Try Again</button>
    </div>

    <!-- GENERATED RECEIPT -->
    <div id="receipt-screen" style="display: none;" class="card-body">
      <div id="receipt-area">
        <div class="receipt-badge">✓ PAYMENT SUCCESSFUL</div>
        <h2 style="font-size: 1.4rem; color: #0f172a;" id="r-payee">--</h2>
        <div class="receipt-tx-id">Txn Ref: <span id="r-txnid"></span></div>
        <div class="divider"></div>
        
        <div class="breakdown-title">Items Paid</div>
        <div id="r-breakdown"></div>
        <div class="divider"></div>
        
        <div class="total-row" style="margin-bottom: 16px;">
          <span>Paid Amount</span>
          <span id="r-total"></span>
        </div>
        
        <div style="font-size: 0.75rem; color: #94a3b8; text-align: center;" id="r-date"></div>
      </div>

      <button class="btn" onclick="downloadPDF()">Download Receipt PDF</button>
    </div>

    <!-- ADMIN LINK GENERATOR (ADMIN VIEW) -->
    <div id="admin-screen" style="display: none;" class="card-body">
      <h3 style="margin-bottom: 12px; color: #0f172a;">Create Bill & Link</h3>
      
      <label>Your UPI ID</label>
      <input type="text" id="adm-upi" value="merchant@upi">

      <label>Payee Name</label>
      <input type="text" id="adm-payee" value="Chit Savings Fund">

      <label>Item 1 Name & Amount (₹)</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="item1-name" value="Monthly Installment">
        <input type="number" id="item1-price" value="5000">
      </div>

      <label>Item 2 Name & Amount (₹) (Optional)</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="item2-name" value="Late Fee">
        <input type="number" id="item2-price" value="0">
      </div>

      <button class="btn btn-success" onclick="createLink()">Generate Shareable Link</button>

      <div id="link-result" style="display: none; margin-top: 12px;">
        <label>Copy this link and send to member:</label>
        <textarea id="output-url" readonly></textarea>
        <button class="btn" onclick="copyLink()">Copy Link</button>
      </div>
    </div>

  </div>

  <div class="admin-toggle" onclick="toggleAdmin()">⚙️ Create a new bill link (Admin)</div>

  <script>
    let paymentData = {
      upiId: "merchant@upi",
      payeeName: "Chit Savings Fund",
      items: [
        { name: "Monthly Chit Contribution", price: 5000 }
      ]
    };

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('data')) {
      try {
        paymentData = JSON.parse(atob(urlParams.get('data')));
      } catch(e) { console.error("Invalid link"); }
    }

    let totalAmount = 0;
    const breakdownList = document.getElementById('breakdown-list');
    const rBreakdown = document.getElementById('r-breakdown');

    paymentData.items.forEach(item => {
      if (item.price > 0) {
        totalAmount += Number(item.price);
        const row = `<div class="item-row"><span>${item.name}</span><span>₹${Number(item.price).toFixed(2)}</span></div>`;
        breakdownList.innerHTML += row;
        rBreakdown.innerHTML += row;
      }
    });

    document.getElementById('payee-name').innerText = paymentData.payeeName;
    document.getElementById('total-amount').innerText = `₹${totalAmount.toFixed(2)}`;

    function triggerUPIPayment() {
      const pa = encodeURIComponent(paymentData.upiId);
      const pn = encodeURIComponent(paymentData.payeeName);
      const am = encodeURIComponent(totalAmount.toFixed(2));
      const tn = encodeURIComponent("Payment to " + paymentData.payeeName);

      window.location.href = `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tn=${tn}&cu=INR`;

      setTimeout(() => {
        document.getElementById('payment-screen').style.display = 'none';
        document.getElementById('confirm-screen').style.display = 'block';
      }, 1500);
    }

    function generateReceipt() {
      document.getElementById('r-payee').innerText = paymentData.payeeName;
      document.getElementById('r-txnid').innerText = "TXN" + Math.floor(1000000000 + Math.random() * 900000000);
      document.getElementById('r-total').innerText = `₹${totalAmount.toFixed(2)}`;
      document.getElementById('r-date').innerText = "Date: " + new Date().toLocaleString();
      
      document.getElementById('confirm-screen').style.display = 'none';
      document.getElementById('receipt-screen').style.display = 'block';
      document.getElementById('receipt-area').style.display = 'block';
    }

    function resetToPayment() {
      document.getElementById('confirm-screen').style.display = 'none';
      document.getElementById('payment-screen').style.display = 'block';
    }

    function downloadPDF() {
      const element = document.getElementById('receipt-area');
      html2pdf().set({ margin: 10, filename: 'Receipt.pdf', html2canvas: { scale: 2 } }).from(element).save();
    }

    // ADMIN FUNCTIONS
    function toggleAdmin() {
      const pScreen = document.getElementById('payment-screen');
      const aScreen = document.getElementById('admin-screen');
      if (aScreen.style.display === 'none') {
        pScreen.style.display = 'none';
        aScreen.style.display = 'block';
      } else {
        aScreen.style.display = 'none';
        pScreen.style.display = 'block';
      }
    }

    function createLink() {
      const upi = document.getElementById('adm-upi').value;
      const payee = document.getElementById('adm-payee').value;
      const i1Name = document.getElementById('item1-name').value;
      const i1Price = document.getElementById('item1-price').value;
      const i2Name = document.getElementById('item2-name').value;
      const i2Price = document.getElementById('item2-price').value;

      const bill = {
        upiId: upi,
        payeeName: payee,
        items: [{ name: i1Name, price: i1Price }]
      };

      if (i2Price > 0) {
        bill.items.push({ name: i2Name, price: i2Price });
      }

      const encoded = btoa(JSON.stringify(bill));
      const fullUrl = window.location.origin + window.location.pathname + "?data=" + encoded;

      document.getElementById('output-url').value = fullUrl;
      document.getElementById('link-result').style.display = 'block';
    }

    function copyLink() {
      const copyText = document.getElementById('output-url');
      copyText.select();
      document.execCommand('copy');
      alert('Link copied! You can now send it on WhatsApp.');
    }
  </script>
</body>
</html>
