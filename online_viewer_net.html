<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Request</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .payment-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
      text-align: center;
    }
    .header {
      margin-bottom: 20px;
    }
    .header h2 {
      font-size: 1.2rem;
      color: #666;
      font-weight: 500;
    }
    .payee-name {
      font-size: 1.4rem;
      color: #1a1a1a;
      font-weight: 700;
      margin-top: 4px;
    }
    .amount-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .amount-label {
      font-size: 0.85rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .amount-value {
      font-size: 2.2rem;
      color: #0f172a;
      font-weight: 800;
      margin-top: 4px;
    }
    .details-group {
      text-align: left;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      color: #64748b;
    }
    .detail-val {
      color: #1e293b;
      font-weight: 600;
    }
    .pay-btn {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      text-decoration: none;
      display: block;
    }
    .pay-btn:active {
      background-color: #1d4ed8;
    }
    .footer-note {
      margin-top: 16px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="payment-card">
    <div class="header">
      <h2>Paying To</h2>
      <div class="payee-name" id="payeeName">John Doe</div>
    </div>

    <div class="amount-box">
      <div class="amount-label">Amount Due</div>
      <div class="amount-value" id="displayAmount">₹500.00</div>
    </div>

    <div class="details-group">
      <div class="detail-row">
        <span class="detail-label">UPI ID</span>
        <span class="detail-val" id="payeeUpi">john@upi</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Transaction Note</span>
        <span class="detail-val" id="paymentNote">Chit Savings Plan</span>
      </div>
    </div>

    <button class="pay-btn" onclick="initiatePayment()">Pay Now</button>

    <p class="footer-note">Supported on Android & iOS via GPay, PhonePe, Paytm, or BHIM.</p>
  </div>

  <script>
    // Configuration details
    const paymentConfig = {
      upiId: "john@upi",          // Replace with your real VPA/UPI ID
      payeeName: "John Doe",      // Replace with payee name
      amount: "500.00",           // Amount to pay
      note: "Chit Savings Plan",  // Transaction description
      currency: "INR"
    };

    // Render configuration to page
    document.getElementById("payeeName").innerText = paymentConfig.payeeName;
    document.getElementById("displayAmount").innerText = "₹" + paymentConfig.amount;
    document.getElementById("payeeUpi").innerText = paymentConfig.upiId;
    document.getElementById("paymentNote").innerText = paymentConfig.note;

    function initiatePayment() {
      // Encode URL parameters securely
      const pa = encodeURIComponent(paymentConfig.upiId);
      const pn = encodeURIComponent(paymentConfig.payeeName);
      const am = encodeURIComponent(paymentConfig.amount);
      const tn = encodeURIComponent(paymentConfig.note);
      const cu = encodeURIComponent(paymentConfig.currency);

      // Build standard UPI deep link protocol
      const upiUrl = `upi://pay?pa=${pa}&pn=${pn}&am=${am}&tn=${tn}&cu=${cu}`;

      // Trigger redirect to open native payment app
      window.location.href = upiUrl;
    }
  </script>

</body>
</html>
