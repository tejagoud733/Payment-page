<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Generate Chit Bill Link</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #1e293b; width: 100%; max-width: 450px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 16px; font-size: 1.3rem; color: #38bdf8; text-align: center; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 8px; font-size: 0.95rem; }
    .btn { width: 100%; background: #10b981; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: 700; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    .btn:active { background: #059669; }
    #result-box { display: none; margin-top: 20px; background: #0f172a; padding: 16px; border-radius: 10px; border: 1px solid #334155; }
    textarea { width: 100%; height: 70px; background: #1e293b; color: #38bdf8; border: 1px solid #334155; border-radius: 8px; padding: 8px; font-size: 0.85rem; margin-top: 8px; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔒 Admin Bill Generator</h2>
    
    <label>Your Member Page URL (e.g. https://your-site.netlify.app/)</label>
    <input type="text" id="base-url" placeholder="Paste your hosted website link here">

    <label>Your Locked UPI ID (Receiver)</label>
    <input type="text" id="upi" value="8522076121@upi">

    <label>Payee / Company Name</label>
    <input type="text" id="payee" value="Chit Savings Trust">

    <label>Member Name</label>
    <input type="text" id="m-name" placeholder="Raju">

    <label>Member Mobile Number</label>
    <input type="text" id="m-phone" placeholder="9247447830">

    <label>Chit Scheme</label>
    <input type="text" id="scheme" value="1-Lakh Chit Plan">

    <label>No. of Chits</label>
    <input type="number" id="chits" value="1">

    <label>Installment Amount (₹)</label>
    <input type="number" id="amt" value="1000">

    <label>Extra Charges / Late Fee (₹)</label>
    <input type="number" id="extra" value="0">

    <button class="btn" onclick="buildLink()">Create Secure Member Link</button>

    <div id="result-box">
      <label style="color: #10b981;">Generated WhatsApp Link:</label>
      <textarea id="generated-link" readonly></textarea>
      <button class="btn" style="background: #3b82f6;" onclick="copyLink()">Copy Link for Member</button>
    </div>
  </div>

  <script>
    // Set base URL automatically from address bar if opened live
    document.getElementById('base-url').value = window.location.href.replace('admin.html', '').split('?')[0];

    function buildLink() {
      let siteUrl = document.getElementById('base-url').value.trim();
      if (!siteUrl.endsWith('/')) siteUrl += '/';

      const upi = encodeURIComponent(document.getElementById('upi').value);
      const payee = encodeURIComponent(document.getElementById('payee').value);
      const name = encodeURIComponent(document.getElementById('m-name').value);
      const phone = encodeURIComponent(document.getElementById('m-phone').value);
      const scheme = encodeURIComponent(document.getElementById('scheme').value);
      const chits = encodeURIComponent(document.getElementById('chits').value);
      const amt = encodeURIComponent(document.getElementById('amt').value);
      const extra = encodeURIComponent(document.getElementById('extra').value);

      const finalUrl = `${siteUrl}?upi=${upi}&payee=${payee}&name=${name}&phone=${phone}&scheme=${scheme}&chits=${chits}&amt=${amt}&extra=${extra}`;

      document.getElementById('generated-link').value = finalUrl;
      document.getElementById('result-box').style.display = 'block';
    }

    function copyLink() {
      const copyText = document.getElementById('generated-link');
      copyText.select();
      document.execCommand('copy');
      alert("Member link copied! Send it to the member on WhatsApp.");
    }
  </script>

</body>
</html>
